<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Align items vertically */
            height: 100vh;
            background-color: white;
        }
        #question {
            display: none; /* Initially hide the question */
            text-align: center;
            margin-bottom: 50px; /* Space between question and input field */
        }
        #answer-input {
            display: none; /* Initially hide the input field */
            width: 600px;
            min-height: 250px; /* Adjustable height */
            border: 4px solid black; /* Thick black border */
            border-radius: 25px; /* Oval shape */
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 25px; /* Space between input field and buttons */
            font-size: 16px;
            color: #333;
        }
        #answer-input::placeholder {
            color: #aaa; /* Grey scale placeholder text */
        }
        #submit-btn, #speak-btn {
            display: none; /* Initially hide the buttons */
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 0px; /* For the submit button */
        }
        #speak-btn {
            margin-left: 0;
            margin-bottom: 10px; /* Space above the submit button */
        }
        #begin-btn {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
        }
        #replay-btn {
            display: none; /* Initially hide the Replay button */
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px; /* Space below the question */
        }
    </style>
</head>
<body>

<button id="begin-btn">Begin</button>
<div id="question">Hey, glad you're here with us. Can you start by telling us what you plan on building as a platform?</div>
<textarea id="answer-input" placeholder="Provide your answer"></textarea>
<button id="speak-btn">Speak</button>
<button id="submit-btn">Submit</button>
<button id="replay-btn">Replay</button> <!-- Replay button -->

<script>
    let audioContext;
    let mediaStreamSource;
    let processor;
    let silenceStart = 0;
    let baseAudioLevel = 0;
    let isRecording = false;
    let audioChunks = [];
    let mediaRecorder;
    let silenceTimeout;

    async function startRecording() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mediaStreamSource = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        mediaStreamSource.connect(processor);
        processor.connect(audioContext.destination);

        silenceStart = performance.now();
        isRecording = true;
        audioChunks = [];

        // Calculate base audio level
        baseAudioLevel = await calculateBaseAudioLevel();

        processor.onaudioprocess = function(event) {
            if (!isRecording) return;

            const input = event.inputBuffer.getChannelData(0);
            let isSilent = true;
            let sum = 0;

            // Calculate the average amplitude of the audio buffer
            for (let i = 0; i < input.length; i++) {
                sum += input[i] * input[i];
            }
            const rms = Math.sqrt(sum / input.length);
            const db = 20 * Math.log10(rms);

            if (db > baseAudioLevel + 10) {
                isSilent = false;
                clearTimeout(silenceTimeout); // Reset silence detection timeout
                silenceTimeout = setTimeout(stopRecording, 1500); // Set a new timeout for 1.5 seconds of silence
            }

            const now = performance.now();
            if (now - silenceStart >= 500) {
                silenceStart = now;
                transcribeAudioChunk();
            }
        };

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.start(500); // Split audio into chunks of 0.5 seconds

        mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            transcribeAudioChunk(true);
        };

        // Initial silence detection setup
        silenceTimeout = setTimeout(stopRecording, 1500);
    }

    async function calculateBaseAudioLevel() {
        return new Promise(resolve => {
            setTimeout(() => {
                const input = processor.inputBuffer.getChannelData(0);
                let sum = 0;
                for (let i = 0; i < input.length; i++) {
                    sum += input[i] * input[i];
                }
                const rms = Math.sqrt(sum / input.length);
                const db = 20 * Math.log10(rms);
                resolve(db);
            }, 250);
        });
    }

    function transcribeAudioChunk(isFinal = false) {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append("audio", audioBlob, "recording.wav");

        fetch("/process_audio", {
            method: "POST",
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            const inputField = document.getElementById('answer-input');
            inputField.value += data.text + ' '; // Append transcribed text with a space
            inputField.style.display = 'block';
            if (isFinal) {
                audioChunks = []; // Clear chunks after final transcription
            }
        })
        .catch(error => console.error("Error:", error));
    }

    function stopRecording() {
        isRecording = false;
        mediaRecorder.stop();
        if (mediaStreamSource) {
            mediaStreamSource.mediaStream.getTracks().forEach(track => track.stop());
        }
    }

    document.getElementById('begin-btn').onclick = function() {
        this.style.display = 'none';
        document.getElementById('question').style.display = 'block';
        document.getElementById('answer-input').style.display = 'block';
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('speak-btn').style.display = 'inline-block';

        var audio = new Audio('/static/InitialGreeting.mp3');
        audio.play();
    };

    document.getElementById('speak-btn').addEventListener('click', startRecording);

    let currentAudioSource = '';

    document.getElementById('submit-btn').onclick = function() {
        const userResponse = document.getElementById('answer-input').value;

        fetch('/submit_response', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ response: userResponse })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('question').innerText = data.nextQuestion;
            document.getElementById('answer-input').value = '';
            currentAudioSource = `/serve_audio/${data.audioDir}/${data.audioFile}`;
            var audio = new Audio(currentAudioSource);
            audio.play();
            document.getElementById('replay-btn').style.display = 'inline-block';
        })
        .catch(error => console.error('Error:', error));
    };

    document.getElementById('replay-btn').onclick = function() {
        if (currentAudioSource) {
            var audio = new Audio(currentAudioSource);
            audio.play();
        }
    };
</script>

</body>
</html>
