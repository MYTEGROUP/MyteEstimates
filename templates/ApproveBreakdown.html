<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Breakdown - {{ name }}</title>
    <style>
    .epic-card, .story-card, .task-card {
        margin: 10px;
        padding: 10px;
        border-radius: 5px;
        transition: all 0.3s ease;
    }
    .epic-card {
        border: 2px solid black;
        background-color: #f9f9f9;
    }
    .story-card {
        border: 2px solid blue;
        background-color: #e9f5ff;
    }
    .task-card {
        border: 2px solid red;
        background-color: #ffe9e9;
    }
    input[type="text"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    button {
        padding: 8px 16px;
        margin: 5px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }
    </style>
</head>
<body>
    <h1>Edit Project Breakdown for: {{ name }}</h1>
    <div style="margin: 20px;">
        <button onclick="window.location.href = '{{ url_for('stakeholder', name=prev_stakeholder) }}'">Previous Stakeholder</button>
        <button onclick="window.location.href = '{{ url_for('stakeholder', name=next_stakeholder) }}'">Next Stakeholder</button>
    </div>
    {% for epic_id, stories in epics.items() %}
        <div class="epic-card" data-epic-id="{{ epic_id }}">
            <h2>{{ stories[0]['Epic Title'] }}</h2>
            <p>{{ stories[0]['Epic Description'] }}</p>
            {% for story in stories %}
                <div class="story-card" data-story-id="{{ story['Story ID'] }}">
                    <input type="text" name="story_title" value="{{ story['Story Description'] }}">
                    {% for task in story['Tasks'] %}
                        <div class="task-card" data-task-id="{{ task['Task ID'] }}">
                            <input type="text" name="task_description" value="{{ task['Description'] }}">
                            <button onclick="approveTask('{{ epic_id }}', '{{ story['Story ID'] }}', '{{ task['Task ID'] }}')">Approve Task</button>
                            <button onclick="deleteTask('{{ epic_id }}', '{{ story['Story ID'] }}', '{{ task['Task ID'] }}')">Delete Task</button>
                        </div>
                    {% endfor %}
                    <button onclick="approveStory('{{ epic_id }}', '{{ story['Story ID'] }}')">Approve Story</button>
                    <button onclick="deleteStory('{{ epic_id }}', '{{ story['Story ID'] }}')">Delete Story</button>
                </div>
            {% endfor %}
            <button onclick="approveEpic('{{ epic_id }}')">Approve Epic</button>
            <button onclick="deleteEpic('{{ epic_id }}')">Delete Epic</button>
        </div>
    {% endfor %}
</body>
<script>
function approveTask(epicId, storyId, taskId) {
    var inputField = document.querySelector(`div[data-task-id="${taskId}"] input[name="task_description"]`);
    var newDescription = inputField.value;
    var data = {
        'action': 'approve_task',
        'epic_id': epicId,
        'story_id': storyId,
        'task_id': taskId,
        'new_description': newDescription  // Send the new description to the server
    };
    sendUpdateRequest(data);
}


function approveStory(epicId, storyId) {
    let allTasksApproved = true;
    const tasks = document.querySelectorAll(`.story-card[data-story-id="${storyId}"] .task-card`);
    tasks.forEach(task => {
        if (!task.dataset.approved) {
            allTasksApproved = false;
        }
    });

    if (!allTasksApproved) {
        alert('Please approve all tasks before approving the story.');
        return;
    }

    var data = { 'action': 'approve_story', 'epic_id': epicId, 'story_id': storyId };
    sendUpdateRequest(data);
}

function approveEpic(epicId) {
    let allStoriesApproved = true;
    const stories = document.querySelectorAll(`.epic-card[data-epic-id="${epicId}"] .story-card`);
    stories.forEach(story => {
        if (!story.dataset.approved) {
            allStoriesApproved = false;
        }
    });

    if (!allStoriesApproved) {
        alert('Please approve all stories before approving the epic.');
        return;
    }

    var data = { 'action': 'approve_epic', 'epic_id': epicId };
    sendUpdateRequest(data);
}

function deleteEpic(epicId) {
    sendUpdateRequest({ 'action': 'delete_epic', 'epic_id': epicId });
}

function deleteStory(epicId, storyId) {
    sendUpdateRequest({ 'action': 'delete_story', 'epic_id': epicId, 'story_id': storyId });
}

function deleteTask(epicId, storyId, taskId) {
    var data = {
        'action': 'delete_task',
        'epic_id': epicId,
        'story_id': storyId,
        'task_id': taskId
    };
    sendUpdateRequest(data, taskId);  // Pass the taskId to identify which task to remove
}


function sendUpdateRequest(data, taskId) {
    fetch('/update', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(responseData => {
        if (responseData.success) {
            alert('Update successful!');
            // Check if it's a delete task action and remove the task from the UI
            if (data.action === 'delete_task' && taskId) {
                var taskCard = document.querySelector(`div[data-task-id="${taskId}"]`);
                if (taskCard) {
                    taskCard.remove();  // Remove the task card from the document
                }
            }
        } else {
            alert('Error: ' + responseData.message);
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        alert('Error sending update request: ' + error.message);
    });
}
</script>


</html>
